<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 572" width="880" height="572" role="img" aria-labelledby="f1t f1d">
<title id="f1t">Baseline architecture</title>
<desc id="f1d">Six layers from the customer chat widget down through the agent host, model provider, MCP server, internal REST API and backing systems. Four boxes on the right mark where a copy of the data comes to rest, with its typical retention.</desc>
<style>
  .bx{fill:#F2F4F5;stroke:#C9D0D6;stroke-width:1}
  .bxs{fill:#E6F0EF;stroke:#1F6F6B;stroke-width:1}
  .bxr{fill:#F7E9E4;stroke:#A6462F;stroke-width:1}
  .h{font:600 14px 'IBM Plex Sans',system-ui,sans-serif;fill:#16191C}
  .s{font:400 12px 'IBM Plex Sans',system-ui,sans-serif;fill:#5A6470}
  .hs{font:600 14px 'IBM Plex Sans',system-ui,sans-serif;fill:#1F6F6B}
  .hr{font:600 14px 'IBM Plex Sans',system-ui,sans-serif;fill:#A6462F}
  .sr{font:400 12px 'IBM Plex Sans',system-ui,sans-serif;fill:#A6462F}
  .cap{font:400 12px 'IBM Plex Sans',system-ui,sans-serif;fill:#5A6470}
  .ar{stroke:#5A6470;stroke-width:1.4;fill:none}
  .ld{stroke:#C9D0D6;stroke-width:1;stroke-dasharray:3 3;fill:none}
</style>
<defs><marker id="f1a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5A6470" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="bx" x="60" y="50" width="250" height="56" rx="7"/>
<text class="h" x="80" y="74">Customer chat widget</text><text class="s" x="80" y="92">signed in, types a question</text>
<line class="ar" x1="185" y1="106" x2="185" y2="127" marker-end="url(#f1a)"/>

<rect class="bx" x="60" y="132" width="250" height="56" rx="7"/>
<text class="h" x="80" y="156">Agent host</text><text class="s" x="80" y="174">session-verified identity</text>
<line class="ar" x1="185" y1="188" x2="185" y2="209" marker-end="url(#f1a)"/>

<rect class="bx" x="60" y="214" width="250" height="56" rx="7"/>
<text class="h" x="80" y="238">Model provider</text><text class="s" x="80" y="256">reasons over tool output</text>
<line class="ar" x1="185" y1="270" x2="185" y2="291" marker-end="url(#f1a)"/>

<rect class="bxs" x="60" y="296" width="250" height="56" rx="7"/>
<text class="hs" x="80" y="320">MCP server</text><text class="s" x="80" y="338">thin wrapper, three tools</text>
<line class="ar" x1="185" y1="352" x2="185" y2="373" marker-end="url(#f1a)"/>

<rect class="bx" x="60" y="378" width="250" height="56" rx="7"/>
<text class="h" x="80" y="402">Internal REST API</text><text class="s" x="80" y="420">built 2021 for the admin UI</text>
<line class="ar" x1="185" y1="434" x2="185" y2="455" marker-end="url(#f1a)"/>

<rect class="bx" x="60" y="460" width="250" height="56" rx="7"/>
<text class="h" x="80" y="484">Backing systems</text><text class="s" x="80" y="502">Postgres, helpdesk, Stripe</text>

<line class="ld" x1="312" y1="160" x2="516" y2="160"/>
<rect class="bxr" x="520" y="132" width="290" height="56" rx="7"/>
<text class="hr" x="540" y="156">Conversation history</text><text class="sr" x="540" y="174">retention often indefinite</text>

<line class="ld" x1="312" y1="242" x2="516" y2="242"/>
<rect class="bxr" x="520" y="214" width="290" height="56" rx="7"/>
<text class="hr" x="540" y="238">Provider context</text><text class="sr" x="540" y="256">retention per API terms</text>

<line class="ld" x1="312" y1="324" x2="516" y2="324"/>
<rect class="bxr" x="520" y="296" width="290" height="56" rx="7"/>
<text class="hr" x="540" y="320">Server debug logs</text><text class="sr" x="540" y="338">retention commonly 400 days</text>

<line class="ld" x1="312" y1="488" x2="516" y2="488"/>
<rect class="bxr" x="520" y="460" width="290" height="56" rx="7"/>
<text class="hr" x="540" y="484">Escalation ticket</text><text class="sr" x="540" y="502">retention commonly 7 years</text>

<text class="cap" x="60" y="548">One question, four copies. You set the retention on one of them, and only if</text>
<text class="cap" x="60" y="566">somebody remembered to.</text>
</svg>
