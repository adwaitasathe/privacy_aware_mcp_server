<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-labelledby="f2t f2d">
<title id="f2t">The model boundary</title>
<desc id="f2d">A vertical boundary separating the server side, where real values live, from model context. Four outbound and action rows show what crosses and in what form. A fifth row shows inbound customer free text, which reaches model context without passing through the server at all.</desc>
<style>
  .bx{fill:#F2F4F5;stroke:#C9D0D6;stroke-width:1}
  .bxs{fill:#E6F0EF;stroke:#1F6F6B;stroke-width:1}
  .bxr{fill:#F7E9E4;stroke:#A6462F;stroke-width:1}
  .col{font:600 13px 'IBM Plex Sans',system-ui,sans-serif;fill:#16191C}
  .colsub{font:400 12px 'IBM Plex Sans',system-ui,sans-serif;fill:#5A6470}
  .f{font:400 12px 'IBM Plex Mono','SFMono-Regular',monospace;fill:#16191C}
  .fm{font:400 12px 'IBM Plex Sans',system-ui,sans-serif;fill:#5A6470}
  .lbl{font:600 11px 'IBM Plex Sans',system-ui,sans-serif;fill:#5A6470}
  .lblr{font:600 11px 'IBM Plex Sans',system-ui,sans-serif;fill:#A6462F}
  .bl{font:600 12px 'IBM Plex Sans',system-ui,sans-serif;fill:#5A6470}
  .cap{font:400 12px 'IBM Plex Sans',system-ui,sans-serif;fill:#5A6470}
  .ar{stroke:#1F6F6B;stroke-width:1.4;fill:none}
  .arr{stroke:#A6462F;stroke-width:1.4;fill:none}
  .arg{stroke:#9AA4AE;stroke-width:1.4;fill:none}
  .bound{stroke:#16191C;stroke-width:1.4;stroke-dasharray:6 5;fill:none}
</style>
<defs>
  <marker id="f2a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1F6F6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="f2r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#A6462F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<line class="bound" x1="430" y1="58" x2="430" y2="498"/>
<text class="bl" x="430" y="46" text-anchor="middle">the boundary</text>

<text class="col" x="40" y="82">Server side</text>
<text class="colsub" x="128" y="82">real values live here</text>
<text class="col" x="500" y="82">Model context</text>
<text class="colsub" x="628" y="82">handles and shaped fields</text>

<rect class="bxs" x="40" y="106" width="250" height="56" rx="7"/>
<text class="f" x="58" y="130">email · phone · street address</text>
<text class="f" x="58" y="148">date of birth · gift recipient</text>
<text class="lblr" x="361" y="126" text-anchor="middle">blocked</text>
<line class="arg" x1="292" y1="140" x2="416" y2="140"/>
<line x1="422" y1="126" x2="422" y2="154" stroke="#A6462F" stroke-width="2.5"/>
<text class="fm" x="500" y="144">never arrives</text>

<rect class="bxs" x="40" y="182" width="250" height="56" rx="7"/>
<text class="f" x="58" y="206">ship_line1 + ship_postal</text>
<text class="f" x="58" y="224">card_brand + card_last4</text>
<text class="lbl" x="361" y="202" text-anchor="middle">confirmation form</text>
<line class="ar" x1="292" y1="216" x2="490" y2="216" marker-end="url(#f2a)"/>
<rect class="bx" x="500" y="182" width="330" height="56" rx="7"/>
<text class="f" x="518" y="206">the address on Oak St ending 97214</text>
<text class="f" x="518" y="224">the visa card ending 4242</text>

<rect class="bxs" x="40" y="258" width="250" height="56" rx="7"/>
<text class="f" x="58" y="282">customer_id</text>
<text class="fm" x="58" y="300">held in the session vault</text>
<text class="lbl" x="361" y="278" text-anchor="middle">handle</text>
<line class="ar" x1="292" y1="292" x2="490" y2="292" marker-end="url(#f2a)"/>
<rect class="bx" x="500" y="258" width="330" height="56" rx="7"/>
<text class="f" x="518" y="282">sub_7f3a</text>
<text class="fm" x="518" y="300">stable in session, meaningless outside</text>

<rect class="bxs" x="40" y="334" width="250" height="56" rx="7"/>
<text class="fm" x="58" y="358">server resolves the address</text>
<text class="fm" x="58" y="376">and sends, at the moment of use</text>
<text class="lbl" x="361" y="354" text-anchor="middle">action, by handle</text>
<line class="ar" x1="490" y1="368" x2="292" y2="368" marker-end="url(#f2a)"/>
<rect class="bx" x="500" y="334" width="330" height="56" rx="7"/>
<text class="f" x="518" y="365">send_reply(ticket_ref, body)</text>

<text class="fm" x="40" y="437">outside the server&#39;s reach</text>
<text class="lblr" x="361" y="424" text-anchor="middle">ungoverned</text>
<line class="arr" x1="872" y1="440" x2="838" y2="440" marker-end="url(#f2r)"/>
<rect class="bxr" x="500" y="412" width="330" height="56" rx="7"/>
<text class="f" x="518" y="436">&#8220;...before my mother&#39;s surgery&#8221;</text>
<text class="fm" x="518" y="454">typed by the customer, already in context</text>

<text class="cap" x="40" y="530">The boundary is asymmetric. Outbound is yours to govern; inbound reaches model</text>
<text class="cap" x="40" y="548">context without touching the server, so it is a retention problem, not a boundary one.</text>
</svg>
